# 章鱼 AI+ 看板 — GitHub Actions 工作流
# 路径备忘：可复制本文件内容到 .github/workflows/run.yml
#
# 四页布局（主标题统一 + 来源标签区分，正文互不重复）：
#   Page1 ◆ 章鱼 AI+·财新社 (一)     Page2 ◆ 章鱼 AI+·财新社 (二)
#   Page3 ◆ 章鱼 AI+·东方财富 (一)   Page4 ◆ 章鱼 AI+·东方财富 (二)
#
# 参数说明：
#   --source       仅影响第1-2页；默认 caixin
#   --pages        默认 1,2,3,4（财新两页 + 东方财富两页）
#   --east-column  第3-4页东方财富栏目，默认 345
#   --title        仅覆盖第1-2页来源标签；主标题固定为 BOARD_TITLE=章鱼 AI+
#   第3-4页始终独立抓取东方财富，并剔除与1-2页重复的标题
name: 章鱼 AI+ 看板

on:
  schedule:
    - cron: '*/30 * * * *'  # 每30分钟 (UTC) = 北京时间每个整点与半点（如 8:00 / 8:30）
  workflow_dispatch:
    inputs:
      hotlist_source:
        description: '第1-2页热榜源（第3-4页固定东方财富）'
        required: false
        default: 'caixin'
        type: choice
        options:
          - caixin
          - eastmoney
          - zhihu
          - bilibili
          - github
      eastmoney_column:
        description: '东方财富栏目ID（第3-4页；345导读/344要闻/340股市）'
        required: false
        default: '345'
        type: string
      custom_title:
        description: '覆盖第1-2页来源标签（主标题固定 章鱼 AI+；留空用默认来源名）'
        required: false
        default: ''
        type: string
      pages:
        description: '推送页面（1,2,3,4=财新+东财四页；1,2=仅财新）'
        required: false
        default: '1,2,3,4'
        type: string
      dry_run:
        description: '仅预览不推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: octopus-board
      cancel-in-progress: false
    steps:
      - name: 获取代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install requests pillow zhdate

      - name: 运行！生成并推送（章鱼 AI+ · 1-2财新 + 3-4东方财富）
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMAP_WEATHER_KEY: ${{ secrets.AMAP_WEATHER_KEY }}
        run: |
          SRC="${{ inputs.hotlist_source || 'caixin' }}"
          PAGES="${{ inputs.pages || '1,2,3,4' }}"
          COL="${{ inputs.eastmoney_column || '345' }}"
          TITLE="${{ inputs.custom_title }}"
          DRY="${{ inputs.dry_run || 'false' }}"

          echo "=========================================="
          echo " 章鱼 AI+ 看板"
          echo "=========================================="
          echo " 主标题(固定): 章鱼 AI+"
          echo " 第1-2页来源:  $SRC"
          echo " 第3-4页来源:  eastmoney (栏目 $COL)"
          echo " 推送页面:     $PAGES"
          echo " 标签覆盖:     ${TITLE:-'(默认来源名)'}"
          echo " dry_run:      $DRY"
          echo " 顶栏示例:"
          echo "   Page1 ◆ 章鱼 AI+·财新社 (一)"
          echo "   Page2 ◆ 章鱼 AI+·财新社 (二)"
          echo "   Page3 ◆ 章鱼 AI+·东方财富 (一)"
          echo "   Page4 ◆ 章鱼 AI+·东方财富 (二)"
          echo "=========================================="

          # 数组拼接参数，避免标题含空格/· 时被 shell 拆分
          ARGS=(--source "$SRC")
          ARGS+=(--pages "$PAGES")
          ARGS+=(--east-column "$COL")
          if [ -n "$TITLE" ]; then
            ARGS+=(--title "$TITLE")
          fi
          if [ "$DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          echo "执行: python main.py ${ARGS[*]}"
          python main.py "${ARGS[@]}"
