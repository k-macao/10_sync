# 章鱼 AI·全景分析 看板（极趣墨水屏 5 页）— GitHub Actions 工作流
#
# 默认行为（schedule 定时触发，零人工干预，mode=brief 常驻看板）：
#   定时：每天两次（UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00）
#   ① 拉取 004 每日简报（k-macao.github.io/004）+ 003 机会点/风险点（push.preview.html）
#      + 007 研报简报（pushplus_deepseek.py 源码提取 BofA 读数与原文文案）
#   ② 解析成 5 页：004 原文 / 机会点·风险点原文 / 机会节点一行一项 / 007 简报 / 风险点提示原文
#   ③ 新鲜度校验（默认 36 小时）+ 排版预算（放不下的如实披露条数）
#   ④ 推送 5 页 400×300 1-bit 图到 Zectrix 墨水屏
#   mode=octopus/news/both 仍走原打氧日报 / 新闻简报管线（main.py，含内容指纹去重）。
#
# 失败即显红、整轮不推：004/003/007 拉不到 / 过期 / 标记缺失 / 推送失败，
# 一律退出码 1 —— Actions 变红告警，墨水屏保留上一次的内容，不会被覆盖成空白或残缺内容。
name: 章鱼 AI·全景分析 看板

on:
  schedule:
    - cron: '0 0,12 * * *'   # 每天两次：UTC 00:00 / 12:00 = 北京时间 08:00 / 20:00
  workflow_dispatch:
    inputs:
      mode:
        description: '看板模式：brief=常驻看板 004/003/007 五页简报（默认）/ octopus=调用仓库02日报 / news=财新+东财 / both=octopus+news'
        required: false
        default: 'brief'
        type: choice
        options:
          - brief
          - octopus
          - news
          - both
      pages:
        description: '推送页面（1,2,3,4,5=五页；1,2=只推前两页）'
        required: false
        default: '1,2,3,4,5'
        type: string
      custom_title:
        description: '覆盖顶栏文案（五页统一；留空即「章鱼 AI·全景分析」）'
        required: false
        default: ''
        type: string
      max_age_hours:
        description: '内容新鲜度上限（小时）；超过就整轮跳过并报错（brief 校验 004 生成时间）'
        required: false
        default: '36'
        type: string
      force:
        description: '即使内容与上次一致也照推（默认跳过，避免反复刷屏）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: '仅预览不推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 防重叠：上一次没跑完就排队，不并发推墨水屏
concurrency:
  group: octopus-board
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install --disable-pip-version-check requests pillow

      - name: 离线回归测试（不联网，先确认解析/排版没退化）
        run: python3 -m unittest discover -s tests -v

      - name: 取回上次推送的内容指纹
        uses: actions/cache/restore@v4
        with:
          path: .octopus
          key: octopus-state-${{ github.run_id }}
          restore-keys: |
            octopus-state-

      - name: 生成并推送（brief=常驻看板 004/003/007 五页简报；octopus/news=仓库 02 打氧日报）
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCTOPUS_STATE_FILE: ${{ github.workspace }}/.octopus/state.json
          OCTOPUS_REPO: ${{ vars.OCTOPUS_REPO || 'k-macao/02' }}
          OCTOPUS_PATH: ${{ vars.OCTOPUS_PATH || 'output/latest.html' }}
        run: |
          MODE="${{ inputs.mode || 'brief' }}"
          PAGES="${{ inputs.pages || '1,2,3,4,5' }}"
          TITLE="${{ inputs.custom_title }}"
          AGE="${{ inputs.max_age_hours || '36' }}"
          FORCE="${{ inputs.force || 'false' }}"
          DRY="${{ inputs.dry_run || 'false' }}"

          echo "=========================================="
          echo " 章鱼 AI·全景分析 看板"
          echo "=========================================="
          echo " 模式:     $MODE"
          echo " 页面:     $PAGES"
          echo " 顶栏:     ${TITLE:-章鱼 AI·全景分析}"
          echo " 日报源:   $OCTOPUS_REPO / $OCTOPUS_PATH"
          echo " 新鲜度:   ${AGE} 小时"
          echo " 内容未变: $([ "$FORCE" = true ] && echo '强制重推' || echo '跳过')"
          echo " dry_run:  $DRY"
          echo "=========================================="

          if [ "$MODE" = "brief" ]; then
            # 常驻看板：004/003/007 五页简报（brief_board.py）
            ARGS=(--pages "$PAGES" --max-age-hours "$AGE")
            if [ -n "$TITLE" ]; then
              ARGS+=(--title "$TITLE")
            fi
            if [ "$DRY" = true ]; then
              ARGS+=(--dry-run)
            fi
            echo "执行: python3 brief_board.py ${ARGS[*]}"
            # 退出码非 0 = 整轮失败：Actions 显红告警，墨水屏保留上一次内容
            python3 brief_board.py "${ARGS[@]}"
          else
            # 数组拼参数，避免标题含空格/· 时被 shell 拆分
            ARGS=(--mode "$MODE" --pages "$PAGES" --max-age-hours "$AGE")
            if [ -n "$TITLE" ]; then
              ARGS+=(--title "$TITLE")
            fi
            if [ "$FORCE" = true ]; then
              ARGS+=(--force)
            fi
            if [ "$DRY" = true ]; then
              ARGS+=(--dry-run)
            fi
            echo "执行: python3 main.py ${ARGS[*]}"
            # 退出码非 0 = 整轮失败：Actions 显红告警，墨水屏保留上一次内容
            python3 main.py "${ARGS[@]}"
          fi

      - name: 记下本次推送的内容指纹
        if: success() && hashFiles('.octopus/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .octopus
          key: octopus-state-${{ github.run_id }}
