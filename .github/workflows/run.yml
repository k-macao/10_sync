# 章鱼 AI·全景分析 看板（极趣墨水屏 4 页）— GitHub Actions 工作流
#
# 默认行为（schedule 定时触发，零人工干预）：
#   ① 拉取「仓库 02 · 章鱼 AI · 打氧日报」的当日推送页 output/latest.html
#      （raw.githubusercontent.com 优先，失败自动切 GitHub Contents API）
#   ② 解析成 4 页：速查卡 / 今日预判 / AI 全篇速览（上）/ AI 全篇速览（下）
#   ③ 新鲜度校验（默认 36 小时）+ 排版预算（放不下的如实披露条数）
#   ④ 推送 4 页 400×300 1-bit 图到 Zectrix 墨水屏
#   ⑤ 记下内容指纹；下一轮内容没变就跳过推送（墨水屏每推一次闪一次，别刷屏）
#
# 失败即显红、整轮不推：仓库 02 拉不到 / 过期 / HTML 改版 / 推送失败，
# 一律退出码 1 —— Actions 变红告警，墨水屏保留上一次的内容，不会被覆盖成空白或残缺内容。
name: 章鱼 AI·全景分析 看板

on:
  schedule:
    - cron: '*/30 * * * *'   # 每 30 分钟自检一次（北京时间每个整点与半点）
  workflow_dispatch:
    inputs:
      mode:
        description: '看板模式：octopus=调用仓库02日报（默认）/ news=财新+东财 / both=都推'
        required: false
        default: 'octopus'
        type: choice
        options:
          - octopus
          - news
          - both
      pages:
        description: '推送页面（1,2,3,4=四页；1,2=只推前两页）'
        required: false
        default: '1,2,3,4'
        type: string
      custom_title:
        description: '覆盖顶栏文案（四页统一；留空即「章鱼 AI·全景分析」）'
        required: false
        default: ''
        type: string
      max_age_hours:
        description: '日报新鲜度上限（小时）；超过就整轮跳过并报错'
        required: false
        default: '36'
        type: string
      force:
        description: '即使内容与上次一致也照推（默认跳过，避免反复刷屏）'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      dry_run:
        description: '仅预览不推送'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# 防重叠：上一次没跑完就排队，不并发推墨水屏
concurrency:
  group: octopus-board
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install --disable-pip-version-check requests pillow

      - name: 离线回归测试（不联网，先确认解析/排版没退化）
        run: python3 -m unittest discover -s tests -v

      - name: 取回上次推送的内容指纹
        uses: actions/cache/restore@v4
        with:
          path: .octopus
          key: octopus-state-${{ github.run_id }}
          restore-keys: |
            octopus-state-

      - name: 生成并推送（调用仓库 02 的打氧日报推送页 → 墨水屏 4 页）
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OCTOPUS_STATE_FILE: ${{ github.workspace }}/.octopus/state.json
          OCTOPUS_REPO: ${{ vars.OCTOPUS_REPO || 'k-macao/02' }}
          OCTOPUS_PATH: ${{ vars.OCTOPUS_PATH || 'output/latest.html' }}
        run: |
          MODE="${{ inputs.mode || 'octopus' }}"
          PAGES="${{ inputs.pages || '1,2,3,4' }}"
          TITLE="${{ inputs.custom_title }}"
          AGE="${{ inputs.max_age_hours || '36' }}"
          FORCE="${{ inputs.force || 'false' }}"
          DRY="${{ inputs.dry_run || 'false' }}"

          echo "=========================================="
          echo " 章鱼 AI·全景分析 看板"
          echo "=========================================="
          echo " 模式:     $MODE"
          echo " 页面:     $PAGES"
          echo " 顶栏:     ${TITLE:-章鱼 AI·全景分析}"
          echo " 日报源:   $OCTOPUS_REPO / $OCTOPUS_PATH"
          echo " 新鲜度:   ${AGE} 小时"
          echo " 内容未变: $([ "$FORCE" = true ] && echo '强制重推' || echo '跳过')"
          echo " dry_run:  $DRY"
          echo "=========================================="

          # 数组拼参数，避免标题含空格/· 时被 shell 拆分
          ARGS=(--mode "$MODE" --pages "$PAGES" --max-age-hours "$AGE")
          if [ -n "$TITLE" ]; then
            ARGS+=(--title "$TITLE")
          fi
          if [ "$FORCE" = true ]; then
            ARGS+=(--force)
          fi
          if [ "$DRY" = true ]; then
            ARGS+=(--dry-run)
          fi

          echo "执行: python3 main.py ${ARGS[*]}"
          # 退出码非 0 = 整轮失败：Actions 显红告警，墨水屏保留上一次内容
          python3 main.py "${ARGS[@]}"

      - name: 记下本次推送的内容指纹
        if: success() && hashFiles('.octopus/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .octopus
          key: octopus-state-${{ github.run_id }}
