name: 墨水屏财新社看板推送

on:
  schedule:
    - cron: '0 * * * *'  # 每小时运行一次
  workflow_dispatch:
    inputs:
      hotlist_source:
        description: '热榜源 (caixin/ eastmoney/ zhihu/ bilibili/ github)'
        required: false
        default: 'caixin'
        type: choice
        options:
          - caixin
          - eastmoney
          - zhihu
          - bilibili
          - github
      eastmoney_column:
        description: '东方财富栏目ID (仅eastmoney生效, 默认345)'
        required: false
        default: '345'
        type: string
      custom_title:
        description: '自定义标题（留空用默认，如 财新社·深度）'
        required: false
        default: ''
        type: string
      pages:
        description: '推送页面 (1,2=财新两页; 1,2,3,4=热榜+财新四页)'
        required: false
        default: '1,2'
        type: string
      dry_run:
        description: '仅预览不推送 (true/false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 获取代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 安装 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install requests pillow

      - name: 运行！生成图片并推送 (财新社)
        env:
          ZECTRIX_API_KEY: ${{ secrets.ZECTRIX_API_KEY }}
          ZECTRIX_MAC: ${{ secrets.ZECTRIX_MAC }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "热榜源: ${{ inputs.hotlist_source || 'caixin' }}"
          echo "页面: ${{ inputs.pages || '1,2' }}"
          ARGS=(--source "${{ inputs.hotlist_source || 'caixin' }}")
          ARGS+=(--pages "${{ inputs.pages || '1,2' }}")
          ARGS+=(--east-column "${{ inputs.eastmoney_column || '345' }}")
          if [ -n "${{ inputs.custom_title }}" ]; then
            ARGS+=(--title "${{ inputs.custom_title }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          python main.py "${ARGS[@]}"
